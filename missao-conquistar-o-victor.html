 return `<div class="box qw" style="align-items:center">${ch("cheer")}<div class="sm"><h2 class="px gr" style="font-size:15px;line-height:1.4">FASE CONCLUÍDA!</h2><p>Pontos na fase: <b>${S.ps}</b> · Acertos: <b>${S.po}/${n}</b></p><p>${t}</p><p>Victor: “${PH[S.p].m}”</p><p>🔓 ${S.p<3?"Próxima fase desbloqueada!":"Final desbloqueado!"}</p></div></div><button class="btn" onclick="S.p<3?(S.p++,S.i=0,S.po=0,S.ps=0,go('ph')):go('final')">${S.p<3?"PRÓXIMA FASE ▶":"FINAL ▶"}</button>`},
final:()=>{const nm=E(S.nm||"Player 1"),f=S.f;
 const rx=f==1?"Eu sabia… 💚 Então bora repetir essa missão: cinema, filme de terror e você me deixando explicar o final.":"Tudo bem. Sinceridade é o que eu mais valorizo, então você já ganhou meu respeito. A porta (e a playlist) continuam abertas.";
 return `<div class="box"><span class="hf" style="left:10px;top:8px">♥</span><span class="hf" style="right:12px;top:40px">♥</span><h1 style="font-size:22px">PARABÉNS!<small>Você chegou ao fim, ${nm}!</small></h1><div class="port"><span data-s="v" data-pose="${f?"cheer":"heart"}" id="vc" class="ch"></span></div><div class="bub">${f?rx:"Conhecer o Victor vai muito além de decorar músicas, nomes e gostos. É entender a história dele, respeitar o contexto de cada pessoa, ter transparência, sinceridade e saber se comunicar."}</div><p class="px" style="font-size:10px;text-align:center">PONTUAÇÃO FINAL: ${S.sc}</p><div data-chest style="width:96px;margin:6px auto"></div>
 ${f?`<button class="btn" id="cb" onclick="cp()">COPIAR RESPOSTAS PRO VICTOR</button><textarea id="ct" rows="6" hidden readonly></textarea><button class="btn" onclick="S=fresh();R()">JOGAR DE NOVO ↻</button>`
 :`<h2 class="sm" style="text-align:center;font-size:14px">Depois de tudo isso, você ainda quer conquistar o Victor?</h2><button class="btn" onclick="S.f=1;R();an($('#vc'),'cheer')">QUERO, E AGORA SEI COMO 💚</button><button class="btn" onclick="S.f=2;R();an($('#vc'),'hop')">PRECISO PENSAR…</button>`}</div>`}
};
// ---------- RESPOSTAS ----------
function fb(t,g){$("#bb").textContent=t;line=t;$("#vc").replaceChildren(spr("v",g?"cheer":"shock"));an($("#vc"),g?"cheer":"shake");upd()}
const nb=()=>{$("#act").innerHTML='<button class="btn" onclick="nx()">CONTINUAR ▶</button>'};
function win(p,t){dn=true;S.sc+=p;S.ps+=p;fb(t+" +"+p+" pts",1);nb();save()}
function bad(){S.lv--;S.sc=Math.max(0,S.sc-5);S.tr++;let t=rnd(NO);
 if(S.lv<=0){S.lv=3;S.sc=Math.max(0,S.sc-10);t="Sem vidas! Victor deu uma segunda chance (-10 pts)."}
 if(S.tr>=2){dn=true;t+=" Vamos seguir…";nb()}else t+=" Tente de novo!";
 fb(t,0);save()}
function pk(k){if(dn)return;if(ord[k]===KEY[S.p][S.i]){S.po++;win(PH[S.p].pt,rnd(OK))}else{document.querySelectorAll(".o")[k].disabled=true;bad()}}
function op(){if(dn)return;const t=$("#ta").value.trim(),r=KEY[S.p][S.i],pt=PH[S.p].pt;
 if(t.length<15){fb("Conta mais um pouquinho… Victor gosta de explicações.",0);return}
 const m=r?(t.match(r)||[]).length:0;let st="para o Victor validar";
 if(r&&m>=2&&t.length>=20){st="aprovada automaticamente";S.po++;win(pt+10,"Resposta madura e sincera! Bônus")}
 else win(Math.round(pt/2),"Anotei. O Victor vai ler essa com atenção…");
 S.pend.push(Q[S.p][S.i][0]+"\n→ "+t+" ("+st+")");save()}
function nx(){S.i++;S.done++;S.tr=0;line="";if(S.i>=Q[S.p].length)S.s="end";R()}
function cp(){const t=`MISSÃO: CONQUISTAR O VICTOR\nJogador(a): ${S.nm||"Player 1"}\nPontos: ${S.sc}\nDecisão final: ${S.f==1?"Quer conquistar!":"Precisa pensar"}\n\nRespostas abertas:\n${S.pend.join("\n\n")}`;
 const sh=()=>{const x=$("#ct");x.hidden=false;x.value=t;x.select()};
 try{navigator.clipboard.writeText(t).then(()=>$("#cb").textContent="COPIADO! ✔",sh)}catch(e){sh()}}
R();
</script></body></html>
